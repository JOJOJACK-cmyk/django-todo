<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>나의 할 일</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f3f5f9;color:#243047;margin:0;padding:40px 16px}main{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}a{color:#315ac6}button,.button{display:inline-block;background:#315ac6;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer;text-decoration:none;font:inherit}.card{background:white;border:1px solid #dce2ed;border-radius:12px;padding:22px;margin-bottom:16px}.completed{background:#eaf3ee}.completed h2{text-decoration:line-through;color:#52665a}.actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.actions form{margin:0}.danger{background:#a82b38}label{display:block;margin-bottom:8px}input[type=text],textarea{width:100%;padding:11px;font:inherit;border:1px solid #a6b1c4;border-radius:6px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}.errorlist{color:#b42332;padding-left:22px}small{color:#657086}.content{white-space:pre-wrap;overflow-wrap:anywhere}h2{overflow-wrap:anywhere}
</style></head><body><main><header><h1>나의 할 일</h1><a href="{% url 'todos:list' %}">목록</a></header>{% block content %}{% endblock %}</main></body></html>
